    <script>
        // Q3. Count Character Frequency

    function countCharacters(str) {
    let result = {};

    for (let i = 0; i < str.length; i++) {
        let char = str[i];

        if (result[char]) {
            result[char]++;
        }
        else {
            result[char] = 1;
        }
    }

    return result;
   }
