    <script>
        // Q2. Remove Duplicate Product IDs
        
        function removeDuplicates(arr) {
        let result = [];

        for (let i = 0; i < arr.length; i++) {
          if (!result.includes(arr[i])) {
            result.push(arr[i]);
         }
       }

        return result;
     }

     console.log(removeDuplicates([101, 102, 103, 101, 104, 102]));

    //  o/p:[101, 102, 103, 104]





    </script>
