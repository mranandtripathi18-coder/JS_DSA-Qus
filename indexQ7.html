    <script>
        // Q7. Find the Highest Product Price
          

        function highestPrice(arr) {
    let highest = arr[0];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > highest) {
            highest = arr[i];
        }
    }

    return highest;
}

console.log(highestPrice([499, 999, 299, 1499, 799]));


// o/p:1499  



    </script>
