    <script>

        // Q4. Reverse a String

        function reverseString(str) {
        let result = "";

       for (let i = str.length - 1; i >= 0; i--) {
          result = result + str[i];
      }

      return result;
     }

       console.log(reverseString("developer"));

    </script>
